server {
    listen {{port}};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = {{health_path}} { access_log off; default_type text/plain; return 200 'ok'; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
