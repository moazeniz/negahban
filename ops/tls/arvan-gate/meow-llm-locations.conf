# MeowMeow LLM gate locations, shared by the :80 (legacy, plain HTTP) and :8443 (TLS) servers.
# Secrets are NOT here: $meow_llm_auth / $meow_llm_window come from /etc/nginx/conf.d/meow-llm.conf and the
# relay credential from /etc/nginx/meow-llm-upstream.conf (both root-only, outside git).
location ~ ^/meow-llm/(v1/messages|v1/models|health|routing|place-context)$ {
    if (-f /etc/nginx/meow-llm.disabled) { return 503; }   # kill switch, no reload needed
    if ($meow_llm_window = 0) { return 403; }               # 3-day access window
    if ($meow_llm_auth = 0) { return 401; }                 # gate token
    rewrite ^/meow-llm/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:9894;
    proxy_set_header Host 127.0.0.1;
    include /etc/nginx/meow-llm-upstream.conf;
    proxy_read_timeout 180s;
    client_max_body_size 4m;
    access_log /var/log/nginx/meow-llm.access.log;
}
location /meow-llm/ { return 404; }
