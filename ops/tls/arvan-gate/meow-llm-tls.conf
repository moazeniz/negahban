# TLS front door for the MeowMeow LLM gate: https://__GATE_IP__:8443/meow-llm/...
# __GATE_IP__ is filled in by enable-tls.sh (GATE_IP); the tracked file stays host-neutral.
# Port 443 on this host is owned by the stream relay (stream.d/recorder-relay.conf), hence 8443.
# Certificate: Let's Encrypt short-lived (6-day) IP-address certificate, renewed by certbot's timer with
# a deploy hook that runs `nginx -t && systemctl reload nginx`.
server {
    listen 8443 ssl http2;          # nginx 1.24: http2 is a listen flag (the `http2 on;` directive is 1.25.1+)
    server_name __GATE_IP__;

    ssl_certificate     /etc/letsencrypt/live/__GATE_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__GATE_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:meowllm:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    include /etc/nginx/snippets/meow-llm-locations.conf;
    location / { return 404; }
}
