name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # reused as the gate of the Deploy workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # a newer commit supersedes; Deploy calls this workflow under its own group

jobs:
  detect:
    name: Detect synced application code
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.d.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        run: |
          if [ -f Dockerfile ] && [ -d negahban ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; echo "::notice::application code not synced yet; app jobs skipped"; fi

  test:
    name: Lint + tests (Python 3.12)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.app == 'true'
    timeout-minutes: 15
    env:
      ORCH_ENABLED: "0"   # tests use a fake Liara transport (tests/conftest.py); LIARA_DRY_RUN must stay unset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            demo-shop/requirements.txt
      - name: Install
        run: make install
      - name: Lint (byte-compile)
        run: make lint
      - name: Tests
        run: make test
      - name: CLI smoke test
        run: if [ -f tools/liara_cli.py ]; then python3 tools/liara_cli.py --help; fi

  platform:
    name: Platform kit (deploy / IaC tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pyyaml==6.0.3 ruff==0.14.0
      - name: Lint platform code (strict)
        run: ruff check --isolated --select E,F,W,B,UP,S --ignore S310,S603,S607,S101,S110,B904,UP007,S108,S202,S104 --line-length 160 --target-version py310 infra ops scaler
      - name: Unit tests against a fake Liara API
        run: python -m unittest discover -s infra/tests -v && python -m unittest discover -s ops/tests -v
      - name: Scaler tests (policy simulations, load balancer, replica controller)
        run: |
          pip install aiohttp==3.14.5
          python -m unittest discover -s scaler/tests -v
      - name: Validate manifests
        run: |
          python - <<'PY'
          import glob, yaml
          for f in sorted(glob.glob("infra/*.yaml")):
              m = yaml.safe_load(open(f))
              for a in m["apps"]:
                  for k in ("name", "port", "plan", "bundle", "healthCheck", "smoke"):
                      assert k in a, f"{f}: {a.get('name')} lacks {k}"
                  assert "envs" not in a or "values" not in a["envs"], f"{f}: env VALUES must not be in git"
              print(f"{f}: {len(m['apps'])} app(s) ok")
          PY
      - name: Verify systemd units
        run: |
          sudo install -d /opt/meow-platform/ops/monitor /opt/meow-platform/ops/backup
          sudo cp ops/monitor/probe.py /opt/meow-platform/ops/monitor/ && sudo cp ops/backup/liara_backup.py /opt/meow-platform/ops/backup/
          systemd-analyze verify ops/systemd/*.service ops/systemd/*.timer
          for f in ops/systemd/*.sh ops/tls/*/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          v=8.30.1; base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfLO "$base/gitleaks_${v}_linux_x64.tar.gz" -O "$base/gitleaks_${v}_checksums.txt"
          grep "gitleaks_${v}_linux_x64.tar.gz" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner --verbose --report-format sarif --report-path gitleaks.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pip-audit (advisory; Dependabot opens the fix PRs)
        continue-on-error: true
        run: |
          pip install pip-audit==2.9.0
          for req in requirements.txt demo-shop/requirements.txt; do
            [ -f "$req" ] || continue
            echo "### pip-audit: \`$req\`" >> "$GITHUB_STEP_SUMMARY"
            if pip-audit -r "$req" --progress-spinner off --format markdown --desc off > audit.md 2>audit.err; then
              echo "No known vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
            else
              cat audit.md >> "$GITHUB_STEP_SUMMARY"; tail -3 audit.err; status=1
            fi
          done
          exit "${status:-0}"

  image:
    name: Image ${{ matrix.name }} (build, smoke, non-root, SBOM, CVE scan)
    runs-on: ubuntu-latest
    needs: [detect, test]
    if: needs.detect.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: negahban, context: ., image: negahban}
          - {name: demo-shop, context: demo-shop, image: demo-shop}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Container smoke test
        run: |
          if [ "${{ matrix.name }}" = negahban ]; then
            envs=(-e ADMIN_PASSWORD=ci -e SESSION_SECRET=ci-session -e LIARA_API_TOKEN=dummy -e LIARA_TEAM_ID=dummy -e LIARA_DRY_RUN=1 -e ORCH_ENABLED=0)
          else
            envs=(-e PAYMENT_GATEWAY_KEY=ci-dummy)
          fi
          docker run -d --name app -p 127.0.0.1:8080:8080 "${envs[@]}" "${{ matrix.image }}:ci"
          for _ in $(seq 1 40); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True, d"
          uid=$(docker exec app awk '/^Uid/{print $2}' /proc/1/status)
          echo "main process uid: $uid"
          [ "$uid" != 0 ] || echo "::warning::${{ matrix.name }} container runs as root"
          docker logs app 2>&1 | tail -n 15; docker rm -f app
      - name: Image facts (size, user, no secrets baked in)
        run: |
          img=${{ matrix.image }}:ci
          size=$(docker image inspect "$img" -f '{{.Size}}')
          echo "### Image \`$img\`: $((size/1024/1024)) MB, $(docker history -q "$img" | wc -l) layers" >> "$GITHUB_STEP_SUMMARY"
          # No env files, keys or VCS metadata may ship inside the image.
          if docker run --rm --entrypoint sh "$img" -c 'find / -xdev \( -name ".env" -o -name "*.pem" -o -name "*.key" -o -name ".git" -o -name "id_rsa" \) -not -path "/proc/*" -not -path "/usr/*" -not -path "/etc/ssl/*" 2>/dev/null' | grep .; then
            echo "::error::secret-like files found in the image"; exit 1
          fi
          docker image inspect "$img" -f 'Env keys: {{range .Config.Env}}{{.}} {{end}}' | sed -E 's/=[^ ]*//g'
      - name: SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: CVE scan (Trivy, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "0"
      - name: Publish scan summary
        if: always()
        run: |
          { echo "### Trivy (CRITICAL/HIGH with a fix available)"; echo '```'; head -c 60000 trivy.txt 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-and-scan-${{ matrix.name }}
          path: |
            sbom.spdx.json
            sbom.cdx.json
            trivy.txt
          retention-days: 30

  liara-preflight:
    name: Liara preflight (read-only dry run + drift plan)
    runs-on: ubuntu-latest
    needs: [platform, detect]
    # only the canonical repository holds the Liara credentials (copies of the repo skip this job)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'moazeniz/negahban'
    timeout-minutes: 10
    env:
      LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
      LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
      LIARA_API_BASE: https://api.iran.liara.ir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      - name: Release dry run (package + release body + read-only preflight; nothing is deployed)
        if: env.LIARA_API_TOKEN != '' && needs.detect.outputs.app == 'true'
        run: |
          for app in negahban-sre demo-shop; do
            python infra/liara_deploy.py deploy --manifest infra/liara.yaml --app "$app" --dry-run --message "ci-${GITHUB_SHA::7}"
          done
      - name: Infrastructure drift (liara_apply.py plan, GET requests only)
        if: env.LIARA_API_TOKEN != ''
        run: |
          set +e
          python infra/liara_apply.py plan -f infra/liara.yaml --no-color > plan.txt 2>&1
          code=$?
          { echo "### Liara drift plan"; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ $code -eq 1 ] && { echo "::error::manifest is invalid for the live account"; exit 1; }
          [ $code -eq 2 ] && echo "::warning::live Liara state drifted from infra/ manifests (see summary)"
          exit 0
      - name: No credentials configured
        if: env.LIARA_API_TOKEN == ''
        run: echo "::notice::LIARA_API_TOKEN secret not set; skipping Liara preflight"
